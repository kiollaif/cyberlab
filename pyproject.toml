[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cyberlab"
version = "0.1.0"
description = "Интерактивный симулятор киберугроз с ветвящейся историей решений"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2,<3",
    "PySide6>=6.8,<7",
]

[project.scripts]
cyberlab = "cyberlab.app:main"

[dependency-groups]
build = [
    "pyinstaller==6.20.0",
]
dev = ["pytest>=8.3,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
