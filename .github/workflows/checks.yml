name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Tests on Linux / X11
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a uv run --locked pytest
      - name: Tests on Windows
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: windows
        run: uv run --locked pytest
      - run: uv build
