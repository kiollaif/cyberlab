name: Desktop builds

on:
  push:
    branches: [main, 'build/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    name: Windows x86_64 / EXE and installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv python install 3.12
      - run: uv sync --locked --group build
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Existing and desktop tests
        env:
          QT_QPA_PLATFORM: windows
        run: uv run --locked pytest --junitxml=desktop-tests.xml
      - name: Bundle Python and Qt without a console
        run: uv run --locked --group build python scripts/build_desktop.py
      - name: Run standalone EXE without Python in PATH
        env:
          QT_QPA_PLATFORM: windows
        run: uv run --locked python scripts/verify_desktop.py dist/desktop/CyberLab.exe --report dist/desktop/windows-portable-smoke.json
      - name: Build Russian per-user installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 is missing from the runner" }
          & $compiler packaging/windows/CyberLab.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Install, verify both shortcuts, run and uninstall
        env:
          QT_QPA_PLATFORM: windows
        run: ./scripts/verify_installer.ps1
      - run: uv run --locked python scripts/build_desktop.py --checksums-only
      - name: Publish verified Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: CyberLab-Windows-x86_64
          path: dist/desktop/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-debug-windows
          path: |
            desktop-tests.xml
            dist/desktop/*.json
            dist/desktop/*.log
            build/pyinstaller/CyberLab/warn-*.txt

  linux:
    name: Linux x86_64 / AppImage (glibc 2.35)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv python install 3.12
      - name: Native Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libopengl0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            desktop-file-utils libglib2.0-bin fuse3
      - run: uv sync --locked --group build
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Existing and desktop tests / X11
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s '-screen 0 1600x1000x24' uv run --locked pytest --junitxml=desktop-tests.xml
      - name: Bundle and build AppImage
        run: uv run --locked --group build python scripts/build_desktop.py
      - name: Run AppImage without Python in PATH / X11
        env:
          QT_QPA_PLATFORM: xcb
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' uv run --locked python scripts/verify_desktop.py dist/desktop/CyberLab-x86_64.AppImage --report dist/desktop/linux-appimage-smoke.json
      - name: Run AppImage through FUSE as a desktop user
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          sudo modprobe fuse
          test -c /dev/fuse
          xvfb-run -a -s '-screen 0 1600x1000x24' uv run --locked python scripts/verify_desktop.py \
            dist/desktop/CyberLab-x86_64.AppImage --report dist/desktop/linux-fuse-smoke.json
      - name: Prepare the same bundle for ALT RPM build
        run: tar -czf dist/desktop/CyberLab-linux-bundle.tar.gz -C dist/frozen CyberLab
      - uses: actions/upload-artifact@v4
        with:
          name: CyberLab-Linux-x86_64
          path: |
            dist/desktop/CyberLab-x86_64.AppImage
            dist/desktop/SHA256SUMS.txt
            dist/desktop/linux-appimage-smoke.json
            dist/desktop/linux-fuse-smoke.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: CyberLab-linux-bundle
          path: dist/desktop/CyberLab-linux-bundle.tar.gz
          compression-level: 0
          retention-days: 7
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-debug-linux
          path: |
            desktop-tests.xml
            dist/desktop/*.json
            build/pyinstaller/CyberLab/warn-*.txt

  desktops:
    name: AppImage / ${{ matrix.desktop }} X11
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        desktop: [kde, gnome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CyberLab-Linux-x86_64
          path: downloads
      - name: Install real window manager
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11 x11-utils python3 libegl1 libgl1 libopengl0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0
          if [ '${{ matrix.desktop }}' = kde ]; then
            sudo apt-get install -y kwin-x11
          else
            sudo apt-get install -y gnome-shell
          fi
      - name: Start compositor and exercise the bundled application
        run: |
          chmod +x downloads/CyberLab-x86_64.AppImage
          dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24 +extension GLX' \
            bash scripts/check_desktop_session.sh '${{ matrix.desktop }}' \
            downloads/CyberLab-x86_64.AppImage reports/${{ matrix.desktop }}-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CyberLab-desktop-${{ matrix.desktop }}-reports
          path: reports/*

  alt-rpm:
    name: ALT p11 / RPM candidate (not Education certification)
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CyberLab-linux-bundle
          path: downloads
      - name: Build and test RPM inside official ALT p11 container
        run: |
          docker run --rm -v "$PWD:/work" -w /work alt:p11 \
            bash packaging/linux/build_rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CyberLab-ALT-p11-unverified-candidate
          path: dist/rpm/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-debug-alt-rpm
          path: dist/rpm/*
